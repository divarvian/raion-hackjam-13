name: raion_hackjam_13
description: "Kawal.Z - Platform Civic-Tech Interaktif untuk Gen Z Indonesia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^2.6.1

  # === ROUTING ===
  go_router: ^14.8.1

  # === SUPABASE ===
  supabase_flutter: ^2.9.0

  # === AUTH ===
  google_sign_in: ^6.2.2

  # === UI COMPONENTS ===
  flutter_card_swiper: ^7.2.0          # Tinder-style swipe cards
  cached_network_image: ^3.4.1         # Image caching
  shimmer: ^3.0.0                      # Shimmer loading effect
  fl_chart: ^0.70.2                    # Donut chart, bar chart
  confetti: ^0.7.0                     # Confetti animation
  flutter_svg: ^2.0.17                 # SVG icons

  # === FONTS ===
  google_fonts: ^6.2.1

  # === UTILS ===
  intl: ^0.19.0                        # Date/number formatting
  url_launcher: ^6.3.1                 # Open external links
  share_plus: ^11.0.0                  # Share to social media
  timeago: ^3.7.0                      # "2 jam lalu" formatting

  # === AI / HTTP ===
  http: ^1.3.0                         # HTTP client for AI API

  # === LOCAL STORAGE ===
  shared_preferences: ^2.3.4

  # === ICONS ===
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/streaks/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/kawalz_logo.png"
